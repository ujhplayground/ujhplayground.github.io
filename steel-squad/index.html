<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스틸 스쿼드</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,'Noto Sans KR',sans-serif;overflow:hidden}
#cv{position:absolute;inset:0;margin:auto;image-rendering:pixelated;background:#000}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.scr[hidden],[hidden]{display:none!important}
.box{background:#1d2230;border:3px solid #e0a030;padding:22px 28px;min-width:330px;max-width:92vw;text-align:center;border-radius:6px}
h1{margin:0 0 6px;font-size:34px;color:#ffcf40;letter-spacing:2px;text-shadow:3px 3px 0 #a33}
button{font:inherit;font-weight:700;padding:10px 18px;margin:6px;border:0;border-radius:4px;background:#e0a030;color:#222;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:#4a5566;color:#fff}
input,select{font:inherit;padding:9px;border-radius:4px;border:0;margin:6px;max-width:100%}
input{width:120px;text-transform:uppercase;text-align:center;letter-spacing:4px}
.msg{min-height:22px;color:#ff8a7a;margin-top:6px}
.help{font-size:13px;color:#aab;margin-top:10px;line-height:1.6}
#plist{list-style:none;padding:0;margin:10px 0;text-align:left}
#plist li{padding:6px 10px;margin:4px 0;background:#2a3142;border-radius:4px}
.code{font-size:32px;letter-spacing:8px;color:#ffcf40;font-weight:800}
#hud{position:absolute;left:8px;top:8px;font-size:13px;pointer-events:none;text-shadow:1px 1px 0 #000,0 0 3px #000;line-height:1.55}
#boss{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(56vw,520px);text-align:center;font-size:13px;font-weight:700;pointer-events:none;text-shadow:1px 1px 0 #000}
#boss .bar{height:10px;background:#400;border:2px solid #000;margin-top:2px}
#boss .bar i{display:block;height:100%;background:#f33}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;color:#ffcf40;text-shadow:3px 3px 0 #a33,0 0 10px #000;pointer-events:none;white-space:pre-line}
</style>
</head>
<body>
<canvas id="cv" width="480" height="270"></canvas>
<div id="hud"></div>
<div id="boss" hidden><span id="bossName"></span><div class="bar"><i id="bossHp"></i></div></div>
<div id="banner"></div>

<div id="gate" class="scr" hidden><div class="box">
  <h1>STEEL SQUAD</h1><div>스틸 스쿼드 · 최대 4인 온라인 협동</div>
  <button id="gateBtn" disabled>로그인 준비 중…</button><div class="msg" id="gateMsg"></div>
</div></div>

<div id="menu" class="scr" hidden><div class="box">
  <h1>STEEL SQUAD</h1><div id="who"></div>
  <div><button id="mkBtn">방 만들기</button></div>
  <div><input id="codeIn" maxlength="4" placeholder="코드"><button id="joinBtn">참가</button></div>
  <div class="msg" id="menuMsg"></div>
  <div class="help">이동 ← → (A D) · 위로 쏘기 ↑ (W) · 엎드리기/아래로 쏘기 ↓ (S)<br>점프 X · K · Space &nbsp; 사격 Z · J &nbsp; 수류탄 C · L<br>↓ + 점프: 발판 아래로 내려가기</div>
</div></div>

<div id="room" class="scr" hidden><div class="box">
  <div>방 코드</div><div class="code" id="roomCode"></div>
  <div class="msg" id="roomRes" style="color:#9f9"></div>
  <ul id="plist"></ul>
  <select id="stageSel"></select>
  <div id="stageInfo" class="help"></div>
  <button id="startBtn">시작</button><button id="leaveBtn" class="sec">나가기</button>
  <div class="msg" id="roomMsg"></div>
</div></div>

<script type="module">
import { initStageArt, drawBack, drawGround, drawMan, drawEnemy, drawBoss, playerPal } from './gfx.js';
// ───────── 기본 ─────────
const W = 480, H = 270, GY = H - 32;
const $ = id => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');
const R = Math.random, clamp = (v, a, b) => v < a ? a : v > b ? b : v, sgn = Math.sign, r1 = v => Math.round(v * 10) / 10;
const noop = () => {};
function rng(s) { let a = s >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuf(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SLOTC = ['#3a7bff', '#ff4a4a', '#3ccf5a', '#ffcc22'];

// ───────── 데이터: 테마 10 · 적 10 · 보스 몸체 5 · 공격 8 ─────────
const THEMES = [
  { n: '사막', adj: '모래폭풍', sky: ['#f4c27a', '#fbe3b0'], far: '#d9a35c', mid: '#c28745', gr: '#b9783a', top: '#e0b060', pl: '#8a5a2b', e: ['#6d7b3a', '#3d4520'] },
  { n: '정글', adj: '밀림', sky: ['#7fc8a9', '#d4f0c8'], far: '#4f8f5f', mid: '#2f6a3f', gr: '#5a3d22', top: '#4caf50', pl: '#6b4a2b', e: ['#8a4b2b', '#4a2a18'] },
  { n: '설원', adj: '빙하', sky: ['#9ec9e8', '#eef6fb'], far: '#c9dbe8', mid: '#a7bfd1', gr: '#cfdbe6', top: '#ffffff', pl: '#8aa0b2', e: ['#5a6c80', '#2e3b4a'] },
  { n: '폐허 도시', adj: '잿빛', sky: ['#8c8fa3', '#d8cfc0'], far: '#6e7080', mid: '#555766', gr: '#5d5a55', top: '#7d7a72', pl: '#4a4844', e: ['#7a3b3b', '#3e1e1e'], city: 1 },
  { n: '공장', adj: '강철', sky: ['#5c5470', '#a99c8a'], far: '#4a4258', mid: '#3a3446', gr: '#4b4b52', top: '#e0a030', pl: '#6a6a72', e: ['#b06a1e', '#5a3410'], city: 1 },
  { n: '동굴', adj: '심연', sky: ['#1c1a24', '#3a3446'], far: '#2c2836', mid: '#24202c', gr: '#4a3f36', top: '#6a5a4a', pl: '#5a4a3a', e: ['#5a7a8a', '#2a3a44'] },
  { n: '항구', adj: '해군', sky: ['#6fa8dc', '#cfe2f3'], far: '#3d6e99', mid: '#2b4f70', gr: '#6b6b6b', top: '#9a9a9a', pl: '#7a5a3a', e: ['#2f4f7f', '#18283f'], city: 1 },
  { n: '화산', adj: '화염', sky: ['#3a0f0f', '#a8401c'], far: '#5a1e14', mid: '#3a120c', gr: '#2a1a16', top: '#ff6a20', pl: '#4a2a20', e: ['#3a3a3a', '#1a1a1a'] },
  { n: '야간 기지', adj: '암흑', sky: ['#0d1530', '#2a3a6a'], far: '#1a2448', mid: '#141c38', gr: '#2a2f3a', top: '#4a8a5a', pl: '#3a4250', e: ['#3a5a3a', '#1a2a1a'], city: 1, stars: 1 },
  { n: '우주 정거장', adj: '궤도', sky: ['#05050f', '#1a1440'], far: '#2a2060', mid: '#1a1640', gr: '#3a3f55', top: '#6ad0ff', pl: '#50566e', e: ['#d0d0e0', '#6a6a80'], city: 1, stars: 1 },
];
const ET = [
  { n: '소총병', hp: 3, w: 12, h: 22, sp: .7, min: 1 },
  { n: '척탄병', hp: 3, w: 12, h: 22, sp: .6, min: 1 },
  { n: '돌격병', hp: 2, w: 12, h: 22, sp: 1.9, min: 1, touch: 1 },
  { n: '점프로봇', hp: 3, w: 14, h: 14, sp: 1.6, min: 1, touch: 1 },
  { n: '폭격드론', hp: 2, w: 16, h: 10, sp: 1, min: 3, air: 1 },
  { n: '방패병', hp: 6, w: 14, h: 22, sp: .45, min: 4 },
  { n: '저격병', hp: 2, w: 12, h: 14, sp: 0, min: 5 },
  { n: '포탑', hp: 8, w: 16, h: 14, sp: 0, min: 6 },
  { n: '공격헬기', hp: 12, w: 28, h: 14, sp: 1, min: 8, air: 1 },
  { n: '경전차', hp: 20, w: 30, h: 18, sp: .4, min: 10, touch: 1 },
];
const BODIES = [
  { n: '중전차', w: 96, h: 56, g: 1 },
  { n: '보행병기', w: 64, h: 84, g: 1 },
  { n: '공격헬기', w: 104, h: 40, g: 0 },
  { n: '요새포대', w: 84, h: 150, g: 1, st: 1 },
  { n: '전폭기', w: 96, h: 30, g: 0 },
];
const ATK = ['spread', 'burst', 'missile', 'bombs', 'laser', 'summon', 'charge', 'wave'];
const WP = {
  P: { n: '권총', r: 10, d: 1, s: 6, l: 55, c: '#ffe066' },
  H: { n: '헤비머신건', r: 4, d: 1, s: 7, l: 55, a: 200, c: '#ffb020' },
  S: { n: '샷건', r: 24, d: 1.5, s: 6, l: 16, n2: 5, a: 30, c: '#ffd0a0' },
  R: { n: '로켓', r: 22, d: 5, s: 2.5, l: 90, a: 30, c: '#ff6030' },
  F: { n: '화염방사기', r: 3, d: .7, s: 3.6, l: 22, pi: 1, a: 150, c: '#ff8020' },
  L: { n: '레이저', r: 7, d: 1.4, s: 10, l: 50, pi: 1, a: 90, c: '#60e0ff' },
};

function stageDef(n) {
  const r = rng(n * 7919 + 13), th = THEMES[Math.floor((n - 1) / 5)];
  const types = shuf(ET.map((_, i) => i).filter(i => ET[i].min <= n), r).slice(0, 4);
  const bi = (n - 1) % 5, body = BODIES[bi];
  const atks = shuf(ATK.filter(a => (a !== 'wave' || body.g) && (a !== 'charge' || !body.st)), r).slice(0, 4);
  const L = 'ABCDEFGHKMRSTVXZ';
  const name = `${th.adj}의 ${body.n} ${L[Math.floor(r() * 16)]}${L[Math.floor(r() * 16)]}-${String(n).padStart(2, '0')}`;
  return { n, th, types, tier: 1 + (n - 1) / 49 * 1.5, boss: { bi, atks, name } };
}

function genLevel(n) {
  const r = rng(n * 104729 + 7), arena = 2600 + n * 36, S = [], waves = [], items = [];
  S.push({ x: -300, y: GY, w: 620, h: H });
  let x = 320, y = GY;
  while (x < arena - 40) {
    if (n > 2 && r() < .18 && x < arena - 200) x += 40 + Math.floor(r() * 3) * 8;
    const w = Math.min(112 + Math.floor(r() * 12) * 16, arena - x);
    if (w < 16) break;
    y = clamp(y + (Math.floor(r() * 5) - 2) * 16, H - 72, H - 24);
    S.push({ x, y, w, h: H });
    if (w >= 96 && r() < .55) S.push({ x: x + 16 + Math.floor(r() * (w - 80)), y: y - 44 - Math.floor(r() * 2) * 20, w: 48 + Math.floor(r() * 3) * 16, h: 6, o: 1 });
    x += w;
  }
  S.push({ x, y: GY, w: arena + W + 300 - x, h: H });
  for (let wx = 400; wx < arena - 160; wx += 150 + r() * 110) waves.push({ x: wx, i: Math.floor(r() * 4) });
  for (let ix = 260; ix < arena - 200; ix += 700 + r() * 400) items.push({ x: ix, k: 'HSRFL'[Math.floor(r() * 5)] });
  return { S, waves, items, arena };
}

// ───────── 상태 ─────────
let G = null, SD = null, LV = null, ART = null, ME = null;
let PL = {}, PLAYERS = {}, META = null, HQ = { h: [], k: [] };
let UID = '', NAME = '', RM = null, IS_HOST = false, MYSLOT = 0, PROG = 0, UNS = [];

function groundTop(x) { let t = null; for (const s of LV.S) if (!s.o && x >= s.x && x < s.x + s.w && (t === null || s.y < t)) t = s.y; return t; }
function solidAt(x, y) { for (const s of LV.S) if (!s.o && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) return true; return false; }
function phys(o, g = .25) {
  o.vy = Math.min(o.vy + g, 6); o.hw = 0;
  o.x += o.vx;
  for (const s of LV.S) {
    if (s.o) continue;
    if (o.x + o.w > s.x && o.x < s.x + s.w && o.y + o.h > s.y && o.y < s.y + s.h) {
      if (o.vx > 0) o.x = s.x - o.w; else if (o.vx < 0) o.x = s.x + s.w;
      o.hw = 1;
    }
  }
  const pb = o.y + o.h; o.y += o.vy; o.onG = 0;
  for (const s of LV.S) {
    if (!(o.x + o.w > s.x && o.x < s.x + s.w)) continue;
    if (s.o) { if (o.vy >= 0 && pb <= s.y + .01 && o.y + o.h >= s.y && !o.drop) { o.y = s.y - o.h; o.vy = 0; o.onG = 1; } }
    else if (o.y + o.h > s.y && o.y < s.y + s.h) {
      if (o.vy >= 0) { o.y = s.y - o.h; o.vy = 0; o.onG = 1; } else { o.y = s.y + s.h; o.vy = 0; }
    }
  }
}
function unstick(o) { for (const s of LV.S) if (!s.o && ov(o, s)) o.y = s.y - o.h; }
function onPlat(p) { return LV.S.some(s => s.o && Math.abs(p.y + p.h - s.y) < .5 && p.x + p.w > s.x && p.x < s.x + s.w); }

function newPlayer(slot) { return { slot, x: 30 + slot * 16, y: GY - 60, vx: 0, vy: 0, w: 12, h: 22, face: 1, aim: 0, cr: 0, hp: 3, lives: 3, dead: 0, rt: 0, inv: 90, wp: 'P', am: 0, gr: 10, cd: 0, sc: 0, gc: 0, onG: 0, drop: 0, an: 0 }; }
const allP = () => [ME, ...Object.values(PL).filter(p => p.ing)].filter(Boolean);
function nearestP(x, y) { let b = null, bd = 1e9; for (const p of allP()) { if (p.dead) continue; const d = Math.abs(p.x + 6 - x) + Math.abs(p.y + 10 - y) * .5; if (d < bd) { bd = d; b = p; } } return b; }

// ───────── 입력 ─────────
const K = {}, PR = {};
const KM = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', KeyX: 'j', KeyK: 'j', Space: 'j', KeyZ: 'f', KeyJ: 'f', KeyC: 'g', KeyL: 'g' };
addEventListener('keydown', e => { if (/INPUT|SELECT/.test(e.target.tagName)) return; const k = KM[e.code]; if (!k) return; if (G) e.preventDefault(); if (!K[k]) PR[k] = 1; K[k] = 1; audio(); });
addEventListener('keyup', e => { const k = KM[e.code]; if (k) K[k] = 0; });
addEventListener('blur', () => { for (const k in K) K[k] = 0; });

// ───────── 사운드 ─────────
let AC = null; const lastS = {};
function audio() { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function sfx(k) {
  if (!AC || (lastS[k] && performance.now() - lastS[k] < 45)) return; lastS[k] = performance.now();
  const P = { shot: ['square', 520, 180, .05, .03], rocket: ['sawtooth', 200, 60, .2, .05], jump: ['square', 300, 600, .08, .02], pick: ['triangle', 600, 1200, .15, .08], hurt: ['sawtooth', 300, 80, .2, .07], boom: ['sawtooth', 120, 30, .35, .09], alarm: ['square', 880, 440, .5, .05], laser: ['sawtooth', 900, 300, .6, .04] }[k];
  if (!P) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
  o.type = P[0]; o.frequency.setValueAtTime(P[1], t); o.frequency.exponentialRampToValueAtTime(P[2], t + P[3]);
  g.gain.setValueAtTime(P[4], t); g.gain.exponentialRampToValueAtTime(.001, t + P[3]); o.start(t); o.stop(t + P[3]);
}

// ───────── 이펙트 ─────────
function boom(x, y, big) {
  for (let i = 0; i < (big ? 14 : 6); i++) G.fx.push({ x: x + (R() - .5) * (big ? 30 : 8), y: y + (R() - .5) * (big ? 30 : 8), vx: (R() - .5) * 1.2, vy: -R() * 1.2, l: 22 + R() * 14, ml: 36, r: big ? 6 : 3, k: 'ex' });
  sfx('boom'); if (big) G.shake = 12;
}
function spark(x, y, c) { for (let i = 0; i < 3; i++) G.fx.push({ x, y, vx: (R() - .5) * 3, vy: (R() - .5) * 3, l: 8, ml: 8, c, k: 'sp' }); }
let bannerT = 0;
function banner(t, f) { $('banner').textContent = t; bannerT = f; }
function bossBoom(B) { for (let i = 0; i < 6; i++) boom(B.x + R() * B.w, B.y + R() * B.h, 1); }

// ───────── 플레이어 ─────────
function updMe() {
  const p = ME; if (!p) return;
  if (p.inv > 0) p.inv--; if (p.cd > 0) p.cd--;
  if (p.dead) { if (p.lives > 0 && --p.rt <= 0) respawn(p); return; }
  const mv = (K.r ? 1 : 0) - (K.l ? 1 : 0);
  if (mv) p.face = mv;
  const was = p.cr; p.cr = K.d && p.onG ? 1 : 0;
  if (p.cr !== was) { const nh = p.cr ? 14 : 22; p.y += p.h - nh; p.h = nh; }
  p.vx = mv * (p.cr ? .6 : 1.6);
  p.aim = K.u ? 1 : (K.d && !p.onG) ? 2 : 0;
  if (PR.j && p.onG) { if (K.d && onPlat(p)) p.drop = 12; else { p.vy = -5.3; sfx('jump'); } }
  if (p.drop > 0) p.drop--;
  phys(p);
  if (p.x < G.cam) { p.x = G.cam; unstick(p); }
  if (p.x > G.cam + W - p.w) p.x = G.cam + W - p.w;
  if (p.y > H + 30) { hurt(p, 1); return; }
  if (p.vx && p.onG) p.an++;
  if (K.f && p.cd <= 0) { shoot(p, 1); p.sc++; }
  if (PR.g && p.gr > 0) { p.gr--; p.gc++; throwG(p, 1); }
  for (const k of G.pk.values()) {
    if (G.taken.has(k.id) || !ov(p, { x: k.x - 6, y: k.y - 6, w: 12, h: 12 })) continue;
    G.taken.add(k.id); take(p, k.k);
    if (G.host) G.pk.delete(k.id); else HQ.k.push(k.id);
  }
  if (p.inv <= 0) {
    for (const e of G.en.values()) if (!e.gone && ET[e.t].touch && ov(p, e)) { hurt(p); break; }
    if (G.boss && !G.boss.gone && ov(p, G.boss)) hurt(p);
    const L = G.boss && G.boss.las;
    if (L && L[1]) { const dx = p.x + 6 - L[2], dy = p.y + p.h / 2 - L[3], c = Math.cos(L[0]), s = Math.sin(L[0]); if (dx * c + dy * s > 0 && Math.abs(-dx * s + dy * c) < 8) hurt(p); }
  }
}
function take(p, k) { if (k === 'B') p.gr = Math.min(30, p.gr + 10); else { p.wp = k; p.am = WP[k].a; } sfx('pick'); }
function hurt(p, fall) {
  if (p.dead || (!fall && p.inv > 0)) return;
  p.hp = fall ? 0 : p.hp - 1; p.inv = 70; sfx('hurt');
  if (p.hp <= 0) { p.dead = 1; p.lives--; p.rt = 100; boom(p.x + 6, p.y + 10, 0); p.wp = 'P'; p.am = 0; }
}
function respawn(p) {
  let x = G.cam + 30 + p.slot * 14;
  for (let i = 0; i < 30 && groundTop(x) === null; i++) x += 8;
  Object.assign(p, { dead: 0, hp: 3, inv: 150, x, y: 10, vx: 0, vy: 0, cr: 0, h: 22, gr: Math.max(p.gr, 5) });
}
function shoot(p, mine) {
  const w = WP[p.wp] || WP.P; p.cd = w.r;
  const dx = p.aim ? 0 : p.face, dy = p.aim === 1 ? -1 : p.aim === 2 ? 1 : 0;
  const ox = p.x + 6 + dx * 9, oy = p.y + (p.cr ? 7 : 9) + dy * 12, n = w.n2 || 1;
  for (let i = 0; i < n; i++) {
    const a = Math.atan2(dy, dx) + (n > 1 ? (i - (n - 1) / 2) * .13 : 0) + (p.wp === 'H' ? (R() - .5) * .08 : 0) + (p.wp === 'F' ? (R() - .5) * .2 : 0);
    G.pb.push({ x: ox, y: oy, vx: Math.cos(a) * w.s, vy: Math.sin(a) * w.s, l: w.l, wp: p.wp, mine, hit: mine && w.pi ? new Set() : null });

  if (!RM || G) return;
  const list = Object.entries(PLAYERS).sort((a, b) => a[1].c - b[1].c);
  $('plist').innerHTML = list.map(([u, p]) => `<li><b style="color:${SLOTC[p.c]}">P${p.c + 1}</b> ${esc(p.n)}${META && u === META.host ? ' 👑' : ''}${u === UID ? ' (나)' : ''}</li>`).join('') + (list.length < 4 ? `<li style="opacity:.5">빈 자리 ${4 - list.length}개 · 코드를 친구에게 알려 주세요</li>` : '');
  const sel = $('stageSel'), max = Math.min(50, PROG + 1), cur = META ? META.stage : 1;
  sel.hidden = !IS_HOST; $('startBtn').hidden = !IS_HOST;
  if (IS_HOST && sel.options.length !== max) sel.innerHTML = Array.from({ length: max }, (_, i) => `<option value="${i + 1}">스테이지 ${i + 1} · ${THEMES[Math.floor(i / 5)].n}</option>`).join('');
  if (IS_HOST) sel.value = String(clamp(cur, 1, max));
  const d = stageDef(cur);
  $('stageInfo').innerHTML = `${IS_HOST ? '' : '방장이 스테이지를 고르는 중…<br>'}<b>스테이지 ${cur} · ${d.th.n}</b><br>적: ${d.types.map(t => d.th.adj + ' ' + ET[t].n).join(', ')}<br>보스: ${esc(d.boss.name)}`;
}
$('stageSel').onchange = () => put(`${RM}/m/stage`, +$('stageSel').value);
$('startBtn').onclick = async () => {
  await DB.set(`${RM}/w`, null).catch(noop); await DB.set(`${RM}/h`, null).catch(noop);
  DB.upd(`${RM}/m`, { st: 'play', stage: +$('stageSel').value, run: Date.now(), res: null, rs: null }).catch(e => $('roomMsg').textContent = errText(e));
};
$('leaveBtn').onclick = () => leaveRoom('');

function resize() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', resize); resize();
init(); requestAnimationFrame(frame);
if (!ONLINE) window.__ss = { get G() { return G; }, get ME() { return ME; }, get LV() { return LV; } };
</script>
</body>
</html>
